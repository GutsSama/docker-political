# Guide Fail2ban — Protection SSH sur le port 1455
#
# 1. Installer Fail2ban sur le VPS :
#    sudo apt install fail2ban -y
#
# 2. Copier ce fichier vers /etc/fail2ban/jail.d/ssh.conf sur le VPS
#    sudo cp fail2ban-ssh.conf /etc/fail2ban/jail.d/ssh.conf
#
# 3. Recharger Fail2ban :
#    sudo systemctl restart fail2ban
#
# 4. Vérifier le statut :
#    sudo fail2ban-client status sshd

[sshd]
enabled  = true
port     = 1455
filter   = sshd
logpath  = %(sshd_log)s
maxretry = 5
bantime  = 3600
findtime = 600
