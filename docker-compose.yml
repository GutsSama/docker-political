services:
  traefik:
    image: traefik:v3.6.2
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"                     # Seul le port HTTP est exposé
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml:ro
    networks:
      - predilection-net
    command:
      - "--configFile=/traefik.yml"

  db:
    image: postgres:17-alpine3.23
    container_name: prediclection-db-container
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    networks:
      - predilection-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

  ingest:
    image: ghcr.io/john-do59/predilection-ingest:latest
    container_name: ingest-container
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - predilection-net

  api:
    image: ghcr.io/john-do59/predilection-api:latest
    container_name: fastapi-container
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./models:/app/saved_models
    networks:
      - predilection-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"        # Toute URL commençant par /api
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000" # Port interne du conteneur api

  django:
    image: ghcr.io/john-do59/predilection-django:latest
    container_name: django-container
    volumes:
      - static_volume:/app/staticfiles
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DJANGO_ALLOWED_HOSTS=164.132.43.245,localhost
    env_file:
      - .env
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - predilection-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.django.rule=PathPrefix(`/`)"        # Tout le reste (attention : l'ordre des routeurs compte, mais Traefik gère la priorité par longueur de chemin, donc /api sera pris avant /)
      - "traefik.http.routers.django.entrypoints=web"
      - "traefik.http.services.django.loadbalancer.server.port=8001"

volumes:
  static_volume:
  db_data:

networks:
  predilection-net:
    driver: bridge