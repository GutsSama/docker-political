services:

  nginx:
    image: nginx:stable-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"   # On n'ouvre plus que celui-là sur l'extérieur !
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro # On donne les clés SSL à Nginx
      - static_volume:/usr/share/nginx/html/static # Nginx les lit ici
    depends_on:
      - django
      - api
    networks:
      - predilection-net
  db:
    image: postgres:17-alpine3.23
    container_name: prediclection-db-container
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    networks:
      - predilection-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

  ingest:
    image: ghcr.io/gutssama/predilection-ingest:latest
    container_name: ingest-container
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - predilection-net
    # Ce conteneur s'arrêtera tout seul une fois l'ingestion finie

  api:
    image: ghcr.io/gutssama/predilection-api:latest
    container_name: fastapi-container
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./api/.env
    networks:
      - predilection-net

  django:
    image: ghcr.io/gutssama/predilection-django:latest
    container_name: django-container
    volumes:
      - static_volume:/app/staticfiles # Django dépose les fichiers ici
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - predilection-net


volumes:
  static_volume:
  db_data:

networks:
  predilection-net:
    driver: bridge
