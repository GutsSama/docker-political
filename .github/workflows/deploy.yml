name: " Release — Test, Build, Push & Deploy"

on:
  push:
    branches:
      - develop
      - main
    tags:
      - "v*.*.*"

jobs:
  # JOB 1 : Tests automatisés FastAPI
  test-api:
    name: Tests FastAPI"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
          pip install -r api/requirements.txt

      - name: Run FastAPI Tests
        env:
          DATABASE_URL: "sqlite:///./test.db"
        run: |
          cd api
          pytest tests/ -v --tb=short

  # JOB 2 : Build + Push des images Docker vers GHCR

  build-and-push:
    name: Build & Push Images GHCR"
    runs-on: ubuntu-latest
    needs: test-api
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extraire le tag de version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
            echo "tag=${BRANCH_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build — Image FastAPI (Local Load)
        uses: docker/build-push-action@v6
        with:
          context: ./api
          load: true
          tags: |
            ghcr.io/john-do59/predilection-api:${{ steps.version.outputs.tag }}
            ghcr.io/john-do59/predilection-api:latest

      - name: Scan Image FastAPI avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/john-do59/predilection-api:${{ steps.version.outputs.tag }}"
          format: "table"
          exit-code: "1" # Bloque le pipeline en cas de criticité
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Push — Image FastAPI
        run: |
          docker push ghcr.io/john-do59/predilection-api:${{ steps.version.outputs.tag }}
          docker push ghcr.io/john-do59/predilection-api:latest

      - name: Build — Image Ingest (Local Load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ingest
          load: true
          tags: |
            ghcr.io/john-do59/predilection-ingest:${{ steps.version.outputs.tag }}
            ghcr.io/john-do59/predilection-ingest:latest

      - name: Scan Image Ingest avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/john-do59/predilection-ingest:${{ steps.version.outputs.tag }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Push — Image Ingest
        run: |
          docker push ghcr.io/john-do59/predilection-ingest:${{ steps.version.outputs.tag }}
          docker push ghcr.io/john-do59/predilection-ingest:latest

      - name: Build — Image Django (Local Load)
        uses: docker/build-push-action@v6
        with:
          context: ./django_political_app
          load: true
          tags: |
            ghcr.io/john-do59/predilection-django:${{ steps.version.outputs.tag }}
            ghcr.io/john-do59/predilection-django:latest

      - name: Scan Image Django avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/john-do59/predilection-django:${{ steps.version.outputs.tag }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Push — Image Django
        run: |
          docker push ghcr.io/john-do59/predilection-django:${{ steps.version.outputs.tag }}
          docker push ghcr.io/john-do59/predilection-django:latest

  # JOB 3 : Déploiement SSH sur le VPS (Environnements Isolés)

  deploy:
    name: Deploy sur le VPS"
    runs-on: ubuntu-latest
    needs: build-and-push

    # Routage dynamique vers l'environnement (dev, staging, prod)
    environment:
      name: ${{ github.ref_type == 'tag' && 'prod' || (github.ref == 'refs/heads/main' && 'staging' || 'dev') }}
      url: https://${{ vars.DOMAIN_NAME }}/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extraire le tag de version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
            echo "tag=${BRANCH_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Transférer les fichiers de configuration sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 1455
          source: "docker-compose.prod.yml,docker-compose.monitoring.yml,scripts/deploy.sh,traefik/traefik.yml,monitoring/"
          target: "/home/${{ secrets.VPS_USER }}/docker-political"
          strip_components: 0

      - name: Déploiement SSH sur le VPS (secrets injectés en mémoire)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 1455
          envs: RELEASE_TAG,DATABASE_URL,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,SECRET_KEY,DEBUG,DOMAIN_NAME,TRAEFIK_DASHBOARD_CREDENTIALS,GITHUB_TOKEN
          script: |
            cd /home/${{ secrets.VPS_USER }}/docker-political
            bash scripts/deploy.sh "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: ${{ secrets.DEBUG }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          TRAEFIK_DASHBOARD_CREDENTIALS: ${{ secrets.TRAEFIK_DASHBOARD_CREDENTIALS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérification post-déploiement (smoke test HTTP)
        run: |
          echo "Test de disponibilité de l'application..."
          # Boucle de retry (max 12 tentatives, toutes les 10 secondes = 2 minutes)
          for i in {1..12}; do
            HTTP_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" https://${{ secrets.DOMAIN_NAME || vars.DOMAIN_NAME }}/home/ || true)
            echo "Tentative $i: HTTP Status = ${HTTP_CODE}"
            if [[ "$HTTP_CODE" =~ ^(200|301|302)$ ]]; then
              echo " Application accessible."
              exit 0
            fi
            sleep 10
          done
          echo " ERREUR : L'application n'a pas répondu correctement."
          exit 1

      - name: Afficher les logs en cas d'erreur
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 1455
          script: |
            cd /home/${{ secrets.VPS_USER }}/docker-political
            docker compose -f docker-compose.prod.yml logs --tail=100 traefik django api
