name: " Release — Test, Build, Push & Deploy"

on:
  push:
    branches:
      - develop
      - main
    tags:
      - "v*.*.*"

jobs:
  # JOB 1 : Tests automatisés FastAPI
  test-api:
    name: Tests FastAPI"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
          pip install -r api/requirements.txt

      - name: Run FastAPI Tests
        env:
          DATABASE_URL: "sqlite:///./test.db"
        run: |
          cd api
          pytest tests/ -v --tb=short

  # JOB 2 : Build + Push des images Docker vers GHCR

  build-and-push:
    name: Build & Push Images GHCR"
    runs-on: ubuntu-latest
    needs: test-api
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extraire le tag de version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
            echo "tag=${BRANCH_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push — Image FastAPI
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/john-do59/predilection-api:${{ steps.version.outputs.tag }}
            ghcr.io/john-do59/predilection-api:latest

      - name: Build & Push — Image Django
        uses: docker/build-push-action@v6
        with:
          context: ./django_political_app
          push: true
          tags: |
            ghcr.io/john-do59/predilection-django:${{ steps.version.outputs.tag }}
            ghcr.io/john-do59/predilection-django:latest

  # JOB 3 : Déploiement SSH sur le VPS (Environnements Isolés)

  deploy:
    name: Deploy sur le VPS"
    runs-on: ubuntu-latest
    needs: build-and-push

    # Routage dynamique vers l'environnement (dev, staging, prod)
    environment:
      name: ${{ github.ref_type == 'tag' && 'prod' || (github.ref == 'refs/heads/main' && 'staging' || 'dev') }}
      url: https://${{ vars.DOMAIN_NAME }}/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extraire le tag de version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
            echo "tag=${BRANCH_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Transférer les fichiers de configuration sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 1455
          source: "docker-compose.prod.yml,scripts/deploy.sh"
          target: "/home/${{ secrets.VPS_USER }}/docker-political"

      - name: Déploiement SSH sur le VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 1455
          script: |
            cd /home/${{ secrets.VPS_USER }}/docker-political
            export RELEASE_TAG="${{ steps.version.outputs.tag }}"
            bash scripts/deploy.sh "$RELEASE_TAG"

      - name: Vérification post-déploiement (smoke test HTTP)
        run: |
          sleep 10
          echo "Test de disponibilité de l'application..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.DOMAIN_NAME }}/home || echo "000")
          echo "HTTP Status: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "302" ]; then
            echo "Application accessible."
          else
            echo " ERREUR : L'application répond HTTP ${HTTP_CODE}."
            exit 1
          fi
