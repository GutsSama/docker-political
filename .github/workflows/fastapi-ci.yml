name: FastAPI CI - Lint, Test and Build

on:
  push:
    # On ne déclenche ce CI que si on touche au dossier de l'API
    branches: [ "develop" ]
    paths:
      - 'api/**'

jobs:
  api-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi

      # 1. Le Linteur (Vérification du style)
      - name: Lint with flake8
        run: |
          flake8 ./api --count --select=E9,F63,F7,F82 --show-source --statistics

      # 2. Les Tests Unitaires (Vérification de l'API)
      - name: Run FastAPI Tests
        run: |
          cd api
          # On utilise pytest pour lancer les tests de l'API
          pytest tests/test_api.py

      # 3. Build & Push si tout est OK
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/john-do59/predilection-api:latest
            ghcr.io/john-do59/predilection-api:${{ github.sha }}