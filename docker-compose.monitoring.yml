version: "3.8"

services:
  node-exporter:
    image: prom/node-exporter:v1.8.1 # Image optimisée et minimale par défaut
    container_name: monitoring-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - predilection-net

  prometheus:
    image: prom/prometheus:v2.54.1 # Version Alpine légère
    container_name: monitoring-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - predilection-net

  grafana:
    image: grafana/grafana:11.1.0 # Utilisation d'une version stable
    container_name: monitoring-grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${POSTGRES_PASSWORD:-admin} # Mot de passe par défaut
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - predilection-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN_NAME}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      # Réutilisation du middleware BasicAuth de Traefik (défini dans docker-compose.prod.yml)
      - "traefik.http.routers.grafana.middlewares=auth@file"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: monitoring-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - predilection-net

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.13-alpine # Version alpine légère
    container_name: monitoring-uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - predilection-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kuma.rule=Host(`kuma.${DOMAIN_NAME}`)"
      - "traefik.http.routers.kuma.entrypoints=websecure"
      - "traefik.http.routers.kuma.tls.certresolver=letsencrypt"
      - "traefik.http.services.kuma.loadbalancer.server.port=3001"
      # Uptime Kuma a son propre système d'authentification intégré,
      # mais on peut forcer le BasicAuth si besoin (on le garde natif par défaut pour l'interface Kuma)

networks:
  predilection-net:
    external: true

volumes:
  prometheus_data:
  grafana_data:
  uptime_kuma_data:
